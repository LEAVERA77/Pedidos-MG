name: CI Oleada 1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-oleada1-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    name: API (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-syntax:
    name: Front raíz (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check (raíz del sitio Pages)
        run: node scripts/check-frontend-syntax.mjs .
